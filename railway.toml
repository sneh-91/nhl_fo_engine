# https://docs.railway.com/guides/config-as-code
# https://docs.railway.com/builds/build-configuration

[build]
builder = "RAILPACK"
# Runs after Railpack install (pip install -r requirements.txt at repo root).
# Requires OPENAI_API_KEY in Railway build variables so embeddings can be generated.
buildCommand = "python scripts/build_nhl_rules_index.py"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
